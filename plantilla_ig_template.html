<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 1080px; height: 1350px;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .canvas {
    width: 1080px; height: 1350px;
    display: flex;
    flex-direction: column;
    background: #f4ede3;
  }
  .top-bar {
    height: 90px;
    background: #1a3a5c;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
    flex-shrink: 0;
  }
  .logo {
    color: #ffffff;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 0.5px;
  }
  .badge {
    background: #f5a623;
    color: #1a3a5c;
    font-size: 15px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    padding: 9px 18px;
    border-radius: 3px;
  }
  .product-zone {
    height: 820px;
    background: #f4ede3;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
  }
  .product-zone::before {
    content: "";
    position: absolute;
    width: 620px;
    height: 620px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(245,166,35,0.16) 0%, rgba(245,166,35,0) 72%);
  }
  .product-zone img {
    position: relative;
    width: 480px;
    height: 480px;
    object-fit: contain;
    filter: drop-shadow(0 18px 30px rgba(26,58,92,0.16));
  }
  .text-zone {
    height: 160px;
    padding: 22px 44px 0;
    flex-shrink: 0;
  }
  .product-name {
    color: #1a3a5c;
    font-size: 42px;
    font-weight: 800;
    line-height: 1.15;
    max-height: 100px;
    overflow: hidden;
  }
  .product-copy {
    color: #2b2b2b;
    font-size: 22px;
    font-weight: 400;
    margin-top: 10px;
  }
  .price-band {
    height: 170px;
    background: #f5a623;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .price {
    color: #1a3a5c;
    font-size: 68px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
  }
  .bottom-bar {
    height: 110px;
    background: #1a3a5c;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .cta {
    color: #ffffff;
    font-size: 22px;
    font-weight: 800;
  }
  .web {
    color: #94b4cc;
    font-size: 16px;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="top-bar">
      <div class="logo">CASAMADO</div>
      <div class="badge">__CATEGORIA__</div>
    </div>
    <div class="product-zone">
      <img src="__FOTO__" alt="producto">
    </div>
    <div class="text-zone">
      <div class="product-name">__NOMBRE__</div>
      <div class="product-copy">__COPY__</div>
    </div>
    <div class="price-band">
      <div class="price">__PRECIO__</div>
    </div>
    <div class="bottom-bar">
      <div class="cta">__CTA__</div>
      <div class="web">casamado.cl</div>
    </div>
  </div>
</body>
</html>
