  <div id="root" data-composition-id="01-oficina-vacia" data-width="1080" data-height="1080">

    <div id="f01-stage" data-layout-allow-overlap data-layout-allow-occlusion data-layout-allow-overflow class="clip" data-start="0" data-duration="4.5" data-track-index="1" style="position:absolute;inset:0;">

        <span class="f01-line"><span class="f01-word" id="f01-w1">¿Qué</span> <span class="f01-word" id="f01-w2">le</span> <span class="f01-word" id="f01-w3">falta<span class="f01-under" id="f01-under"></span></span></span>
        <span class="f01-line"><span class="f01-word" id="f01-w4">a</span> <span class="f01-word" id="f01-w5">tu</span> <span class="f01-word" id="f01-w6">oficina?</span></span>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const $ = (id) => "#f01-" + id;
      const O = Office3D(document.getElementById("f01-mount"), "f01-");
      Object.values(O.products).forEach((p) => { p.bb.style.opacity = 0; p.shadow.style.opacity = 0; });
      Object.values(O.chips).forEach((c) => { c.bb.style.opacity = 0; });

      // Scene 1 — a flat blueprint draws itself
      const flat = Object.assign({}, O.FLAT, { wall: 0 });
      tl.fromTo(O.cam, flat, Object.assign({}, flat, { duration: 0.01, onUpdate: O.apply, immediateRender: true }), 0);
      const top = O.topWallPaths;
      top.forEach((p) => { const len = p.getTotalLength() * 1.05; p.style.strokeDasharray = len; p.dataset.len = len; });
      tl.fromTo(top[0], { strokeDashoffset: top[0].dataset.len }, { strokeDashoffset: 0, duration: 1.0, ease: "power2.out" }, 0.15);
      top.slice(1).forEach((p, i) => tl.fromTo(p, { strokeDashoffset: p.dataset.len }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 0.55 + i * 0.15));
      tl.fromTo([O.furniture, O.floor], { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power1.out" }, 0.85);
      tl.fromTo(O.labels, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 1.25);
      tl.fromTo($("meta"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0.2);

      // Scene 2 — the question, word by word
      ["w1", "w2", "w3", "w4", "w5", "w6"].forEach((w, i) => {
        tl.fromTo($(w), { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 1.2 + i * 0.13 + (i >= 3 ? 0.18 : 0));
      });
      tl.fromTo($("under"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 2.25);

      // Scene 3 — the blueprint tilts into a 3D office and the walls rise
      tl.fromTo(O.cam, Object.assign({}, flat), Object.assign({}, O.HOME, { wall: 1, duration: 1.3, ease: "power2.inOut", onUpdate: O.apply, immediateRender: false }), 2.35);

      // Scene 4 — the empty rooms get tagged
      ["papel", "cafe", "toner"].forEach((k, i) => {
        tl.fromTo(O.tags[k].drop, { opacity: 0, y: -70 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.8)" }, 3.45 + i * 0.25);
