  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const P = "f01-";
      const walls = Array.from(document.getElementById(P + "walls").querySelectorAll("path"));
      walls.forEach((p) => {
        const len = p.getTotalLength() * 1.05;
        p.style.strokeDasharray = len;
        p.style.strokeDashoffset = len;
      });
      const furniture = document.getElementById(P + "furniture");
      const labels = document.getElementById(P + "labels");

      // Scene 1 — the plan draws itself (outer wall first, then the partitions)
      tl.fromTo(walls[0], { strokeDashoffset: walls[0].style.strokeDashoffset }, { strokeDashoffset: 0, duration: 1.0, ease: "power2.out" }, 0.15);
      walls.slice(1).forEach((p, i) => {
        tl.fromTo(p, { strokeDashoffset: p.style.strokeDashoffset }, { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 0.55 + i * 0.16);
      });
      tl.fromTo(furniture, { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power1.out" }, 0.9);
      tl.fromTo(labels, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 1.3);
      tl.fromTo("#" + P + "meta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0.2);

      // Scene 2 — the question, word by word
      ["w1", "w2", "w3", "w4", "w5", "w6"].forEach((w, i) => {
        tl.fromTo("#" + P + w, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 1.2 + i * (i < 3 ? 0.14 : 0.12) + (i >= 3 ? 0.18 : 0));
      });
      tl.fromTo("#" + P + "under", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 2.25);

      // Scene 3 — the empty rooms get tagged
      [["tag1", -3], ["tag2", 2], ["tag3", -2]].forEach(([t, r], i) => {
        tl.fromTo("#" + P + t, { opacity: 0, scale: 1.35, rotation: r * 3 }, { opacity: 1, scale: 1, rotation: r, duration: 0.32, ease: "back.out(2)" }, 2.9 + i * 0.35);
      });

      tl.to({}, { duration: 0.01 }, 4.49);
      window.__timelines["01-oficina-vacia"] = tl;
    })();
  </script>
