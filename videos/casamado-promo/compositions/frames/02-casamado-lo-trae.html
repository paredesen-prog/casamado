  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const $ = (id) => "#f02-" + id;
      const O = Office3D(document.getElementById("f02-mount"), "f02-");
      Object.values(O.products).forEach((p) => { p.bb.style.opacity = 0; p.shadow.style.opacity = 0; });
      Object.values(O.chips).forEach((c) => { c.bb.style.opacity = 0; });
      O.set(Object.assign({}, O.HOME, { wall: 1 }));
      const mount = document.getElementById("f02-mount");
      const tagDrops = ["papel", "cafe", "toner"].map((k) => O.tags[k].drop);

      // Scene 1 — tags clear, the office dims into a stage
      tl.fromTo(tagDrops, { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power1.out", stagger: 0.06 }, 0.05);
      tl.fromTo(mount, { opacity: 1 }, { opacity: 0.25, duration: 0.55, ease: "power2.out" }, 0.1);
      tl.fromTo($("disc"), { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 0.25);

      // Scene 2 — the lockup blooms from zero
      tl.fromTo($("logo"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.85, ease: "back.out(1.6)", transformOrigin: "50% 50%" }, 0.4);

      // Scene 3 — the promise
      tl.fromTo($("l1"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.3);
      tl.fromTo($("l2"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.85);
      tl.fromTo($("block"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 2.2);

      // Scene 4 — hand the bare office back to the tour
      tl.fromTo([$("logo"), $("disc")], { scale: 1, opacity: 1 }, { scale: 0.6, opacity: 0, duration: 0.5, ease: "power2.in", transformOrigin: "50% 50%", immediateRender: false }, 3.15);
      tl.fromTo($("head"), { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power1.in", immediateRender: false }, 3.3);
      tl.fromTo(mount, { opacity: 0.25 }, { opacity: 1, duration: 0.5, ease: "power2.out", immediateRender: false }, 3.35);
