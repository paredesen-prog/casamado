      const len = route.getTotalLength();
      route.style.strokeDasharray = len;
      route.style.strokeDashoffset = len;
      const wrap = document.getElementById("f05-boxwrap");
      const prog = { t: 0 };
      const place = () => { const p = route.getPointAtLength(prog.t * len); wrap.style.left = p.x + "px"; wrap.style.top = p.y + "px"; };
      place();
      tl.fromTo(route, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 1.4, ease: "power2.inOut" }, 1.0);
      tl.fromTo(prog, { t: 0 }, { t: 1, duration: 1.4, ease: "power2.inOut", onUpdate: place, immediateRender: true }, 1.0);
