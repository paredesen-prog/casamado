    (function () {
      const tl = gsap.timeline({ paused: true });
      const $ = (id) => "#f04-" + id;
      const world = document.getElementById("f04-world");
      const cam = { z: 1.8, x: 525, y: 766 };
      const apply = () => { world.style.transform = `translate(${540 - cam.z * cam.x}px, ${540 - cam.z * cam.y}px) scale(${cam.z})`; };
      apply();

      // Scene 1 — one long decelerating zoom-out to the whole stocked office (signature move)
      tl.fromTo(cam, { z: 1.8, x: 525, y: 766 }, { z: 1, x: 540, y: 540, duration: 1.8, ease: "expo.out", onUpdate: apply, immediateRender: true }, 0);
      tl.fromTo([$("band"), $("r1"), $("r2")], { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 1.1);

      // Scene 2 — the count climbs, with value-scaled growth
      const counter = document.getElementById("f04-count");
      const fmt = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      const st = { v: 0 };
      tl.fromTo($("num"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 1.4);
      tl.fromTo(st, { v: 0 }, { v: 1100, duration: 1.4, ease: "power2.out", onUpdate: () => { counter.textContent = fmt(Math.round(st.v)); } }, 1.4);
      tl.fromTo($("num"), { scale: 0.62 }, { scale: 1, duration: 1.4, ease: "power2.out" }, 1.4);
      tl.fromTo($("numbar"), { scaleX: 0 }, { scaleX: 1, duration: 1.4, ease: "power2.out" }, 1.4);
      tl.fromTo($("label"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 2.75);

      // Scene 3 — hold the full office and the number
      tl.to({}, { duration: 0.01 }, 4.49);
      window.__timelines["04-mas-de-1100"] = tl;
    })();
